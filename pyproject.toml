[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "surplife-ble"
version = "0.1.4"
description = "BLE discovery, protocol probing, and Home Assistant support for Surplife/MagicHome2 lights"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Nathan Bland" }]
dependencies = [
  "bleak>=2.0,<4",
]

[project.optional-dependencies]
reference = [
  "flux-led==1.2.0",
  "led-ble==1.1.11",
]
test = [
  "pytest>=8.4",
  "pytest-asyncio>=1.1",
  "ruff>=0.12",
]

[project.scripts]
ble-rgb = "surplife_ble.cli:main"

[tool.setuptools.packages.find]
where = ["src", "."]
include = ["surplife_ble*", "custom_components.surplife_ble*"]
namespaces = true

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

